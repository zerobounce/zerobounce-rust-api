# Dependabot: security updates only (no version-update PRs).
# Grouped security PRs open weekly on Tuesday morning (Europe/Bucharest).
# Auto-merge: .github/workflows/dependabot-auto-merge.yml (on PR + Tuesday cron).
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels:
      - "dependabot-security"
      - "rust dependencies"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels:
      - "dependabot-security"
      - "github dependencies"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    # Keep the rust base image on 1.88 (the MSRV floor): no major/minor bumps.
    ignore:
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependabot-security"
      - "docker dependencies"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
