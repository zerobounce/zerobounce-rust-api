# Run unit and integration tests on every PR.
name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      # Warnings fail the build. --all-features is left out on purpose: it would also lint
      # the opt-in live suite (tests/live_api.rs, feature "live").
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --no-fail-fast

      # Exercises the `include` list in Cargo.toml: lists what would ship to crates.io, then
      # builds the crate from that packaged copy, so a file the build needs but `include`
      # leaves out fails here rather than at publish time.
      - name: Package check
        run: |
          cargo package --list
          cargo package

  msrv:
    # Build and test on the oldest supported Rust (`rust-version` in Cargo.toml).
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    env:
      # Cargo.lock is not committed, so resolve dependency versions that
      # support this toolchain rather than the newest ones.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.88"

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test --no-fail-fast
