[package]
name = "zero-bounce"
version = "4.0.0"
edition = "2021"
rust-version = "1.88"
description = "Wrapper library over the ZeroBounce API v2"
homepage = "https://www.zerobounce.net"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zerobounce/zerobounce-rust-api"
documentation = "https://docs.rs/zero-bounce"
keywords = ["zerobounce", "email-validation", "email-verification", "email", "api"]
categories = ["api-bindings", "email"]
# Ship the library only: no tests (the live suite included), examples, CI,
# Docker or env files. LICENSE stays in the package alongside the SPDX license.
include = ["src/**/*.rs", "README.md", "LICENSE", "CHANGELOG.md"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.4.0"
chrono = "0.4.24"
reqwest = { version = "0.13.2", features = ["blocking", "multipart", "query", "form"] }
serde = { version ="1.0.159", features = ["derive"] }
serde_json = "1.0.95"

[features]
# The live API suite. Off by default, so `cargo test` and CI never touch the
# network: run it with `cargo test --features live --test live_api`.
live = []

[[test]]
name = "live_api"
required-features = ["live"]

[dev-dependencies]
mockito = "1.0.2"
dotenv = "0.15"
